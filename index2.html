<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Completo</title>
    <style>
        /* Estilos CSS integrados */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        form {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: left;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Formulario de Registro ANGEL FRANCISCO DOMINGUEZ SALMERON </h1>

    <form>
        <!-- Campo de texto -->
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required>

        <!-- Campo de correo -->
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email">

        <!-- Campo de contraseña -->
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password">

        <!-- Campo numérico -->
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="1" max="100">

        <!-- Campo de fecha -->
        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" id="fecha" name="fecha">

        <!-- Lista desplegable -->
        <label for="pais">País:</label>
        <select id="pais" name="pais">
            <option value="">Selecciona tu país</option>
            <option value="mx">México</option>
            <option value="ar">Argentina</option>
            <option value="co">Colombia</option>
            <option value="es">España</option>
        </select>

        <!-- Botones de opción (radio) -->
        <p>Género:</p>
        <label><input type="radio" name="genero" value="masculino"> Masculino</label>
        <label><input type="radio" name="genero" value="femenino"> Femenino</label>
        <label><input type="radio" name="genero" value="otro"> Otro</label>

        <!-- Casillas de verificación -->
        <p>Intereses:</p>
        <label><input type="checkbox" name="intereses" value="musica"> Música</label>
        <label><input type="checkbox" name="intereses" value="deportes"> Deportes</label>
        <label><input type="checkbox" name="intereses" value="tecnologia"> Tecnología</label>

        <!-- Área de texto -->
        <label for="comentarios">Comentarios:</label>
        <textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea>

        <!-- Subida de archivo -->
        <label for="archivo">Sube tu foto:</label>
        <input type="file" id="archivo" name="archivo">

        <!-- Control de rango -->
        <label for="nivel">Nivel de satisfacción:</label>
        <input type="range" id="nivel" name="nivel" min="0" max="10">

        <!-- Botones -->
        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
